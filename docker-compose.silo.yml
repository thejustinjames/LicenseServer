name: license-server-silo

services:
  # The database is not defined here. It is the license_server_db container
  # from docker-compose.yml (volume licenseserver_postgres_data), reached over
  # that project's network. Declaring it again would clash on the container
  # name and, under this project name, start on a fresh empty volume.

  # License Server App - connected to silo-lab
  app:
    build: .
    container_name: license-server
    restart: unless-stopped
    environment:
      # Database - existing container from docker-compose.yml
      DATABASE_URL: postgresql://postgres:postgres@license_server_db:5432/license_server?schema=public

      # Server
      PORT: 3000
      NODE_ENV: production
      APP_URL: https://licenseserver.lab.silo.red
      # nginx sits in front of this container: trust one proxy hop so
      # rate limiting / lockout key on the real client IP.
      TRUST_PROXY: "1"

      # JWT Auth
      JWT_SECRET: ${JWT_SECRET:-license-server-jwt-secret-2026}
      JWT_EXPIRES_IN: 7d

      # Auth - the lab's Cognito emulator (silo-cognito). It signs HS256 with
      # the lab's shared JWT secret and serves no JWKS, hence the emulator
      # secret. Staff pool only; the emulator has a single pool and client.
      AUTH_PROVIDER: cognito
      COGNITO_ENDPOINT: http://silo-cognito:9080
      COGNITO_EMULATOR_JWT_SECRET: ${SILO_JWT_SECRET:-silo-jwt-secret-key-for-testing}
      COGNITO_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_SILO00001
      COGNITO_CLIENT_ID: silo-dist-client
      # Admin group is the default, license-admins (seeded in silo-cognito).
      STAFF_EMAIL_DOMAINS: alpha.silo-dev.com,agencio.cloud
      # Lab users have no TOTP enrolled; admin routes otherwise demand it.
      ADMIN_REQUIRE_MFA: "false"

      # S3/Storage - use silo-storage
      S3_ENDPOINT: http://silo-storage:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_NAME: license-server-downloads
      AWS_ACCESS_KEY_ID: silo-admin
      AWS_SECRET_ACCESS_KEY: silo-secret-key
      AWS_REGION: us-east-1
      S3_DOWNLOAD_EXPIRY_HOURS: "4"

      # Redis - disabled for now (silo-redis on different network)
      # REDIS_URL: redis://172.30.0.15:6379/6

      # CORS
      CORS_ORIGINS: https://licenseserver.lab.silo.red,https://licencing.agencio.cloud,http://localhost:3100

      # hCaptcha (get keys from https://dashboard.hcaptcha.com)
      HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
      CAPTCHA_FAIL_OPEN: "false"

      # Account lockout
      ACCOUNT_LOCKOUT_ATTEMPTS: "5"
      ACCOUNT_LOCKOUT_DURATION_MINUTES: "15"

      # Stripe (from .env)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: https://licenseserver.lab.silo.red/success
      STRIPE_CANCEL_URL: https://licenseserver.lab.silo.red/cancel

      # Email (optional - from .env if configured)
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      # EMAIL_SENDER: Set in .env if email is configured

    env_file:
      - .env
    volumes:
      - ./keys:/app/keys:ro
    expose:
      - "3000"
    ports:
      # Host port 3100 for direct access; 3000 is often taken by other dev
      # servers. The lab route is https://licenseserver.lab.silo.red via silo-nginx.
      - "3100:3000"
    networks:
      licenseserver:
      silo-lab:
        ipv4_address: 172.30.0.50
    dns:
      - 172.30.0.2   # silo-dns
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Initialize bucket in silo-storage
  storage-init:
    # minio/mc is no longer pullable from Docker Hub; the server image ships mc.
    image: minio/minio:latest
    container_name: license-server-storage-init
    entrypoint: >
      /bin/sh -c "
        sleep 5
        mc alias set silo http://silo-storage:9000 silo-admin silo-secret-key
        mc mb silo/license-server-downloads --ignore-existing
        mc anonymous set download silo/license-server-downloads
        echo 'Storage bucket initialized'
      "
    networks:
      - silo-lab
    restart: "no"
    depends_on:
      - app

networks:
  licenseserver:
    external: true
    name: licenseserver_default
  silo-lab:
    external: true
    name: silo-lab
